apiVersion: kro.run/v1alpha1
kind: VotingApp
metadata:
  name: dogsvscats-voting-app
  namespace: default
spec:
  name: dogsvscats
  namespace: default
  voteImage: "dogsvscats/vote:latest"
  resultImage: "dogsvscats/result:latest"
  workerImage: "dogsvscats/worker:latest"
  domain:
    enabled: true
  acm:
    enabled: true
  ingress:
    enabled: true
  service:
    enabled: true
  redis:
    enabled: true
  postgres:
    enabled: true
  configMapName: "krmops-infrastructure-config"