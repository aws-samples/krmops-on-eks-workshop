apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: voting-app.kro.run
spec:
  schema:
    apiVersion: v1alpha1
    kind: VotingApp
    spec:
      name: string
      namespace: string | default="default"
      region: string | default="us-west-2"
      clusterName: string | default="krmops-on-eks"
      voteImage: string
      resultImage: string
      workerImage: string
      domain:
        enabled: boolean | default=true
        baseDomain: string | default="dogsvscats.us"
        subdomain: string | default="workshop"
        hostedZoneId: string
      acm:
        enabled: boolean | default=true
      ingress:
        enabled: boolean | default=true
      service:
        enabled: boolean | default=true
      redis:
        enabled: boolean | default=true
      postgres:
        enabled: boolean | default=true
      vpcID: string
      subnetIDs: "[]string"
    status:
      voteReplicas: ${votedeployment.status.availableReplicas}
      resultReplicas: ${resultdeployment.status.availableReplicas}
      workerReplicas: ${workerdeployment.status.availableReplicas}

  resources:
  # --- ACM Certificate ---
  - id: acmcertificate
    includeWhen:
      - ${schema.spec.acm.enabled}
      - ${schema.spec.domain.enabled}
    readyWhen:
      - ${has(acmcertificate.status.ackResourceMetadata.arn)}
    template:
      apiVersion: acm.services.k8s.aws/v1alpha1
      kind: Certificate
      metadata:
        name: ${schema.spec.name}-certificate
        namespace: ${schema.spec.namespace}
      spec:
        domainName: ${schema.spec.domain.subdomain}.${schema.spec.domain.baseDomain}
        subjectAlternativeNames:
        - "*.${schema.spec.domain.subdomain}.${schema.spec.domain.baseDomain}"

  # --- Redis Resources ---
  - id: redissubnetgroup
    includeWhen:
      - ${schema.spec.redis.enabled}
    readyWhen:
      - ${has(redissubnetgroup.status.ackResourceMetadata)}
    template:
      apiVersion: elasticache.services.k8s.aws/v1alpha1
      kind: CacheSubnetGroup
      metadata:
        name: ${schema.spec.name}-redis-subnet-group
        namespace: ${schema.spec.namespace}
      spec:
        cacheSubnetGroupDescription: "Redis ElastiCache subnet group for voting app"
        cacheSubnetGroupName: ${schema.spec.name}-redis-subnet-group
        subnetIDs: ${schema.spec.subnetIDs}

  - id: redissecuritygroup
    includeWhen:
      - ${schema.spec.redis.enabled}
    readyWhen:
      - ${has(redissecuritygroup.status.id)}
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: SecurityGroup
      metadata:
        name: ${schema.spec.name}-redis-sg
        namespace: ${schema.spec.namespace}
      spec:
        name: ${schema.spec.name}-redis-sg
        description: "Redis ElastiCache security group for voting app"
        vpcID: ${schema.spec.vpcID}
        ingressRules:
        - fromPort: 6379
          toPort: 6379
          ipProtocol: tcp
          ipRanges:
          - cidrIP: "10.0.0.0/16"

  - id: rediscluster
    includeWhen:
      - ${schema.spec.redis.enabled}
    readyWhen:
      - ${has(rediscluster.status.cacheClusterStatus)}
    template:
      apiVersion: elasticache.services.k8s.aws/v1alpha1
      kind: CacheCluster
      metadata:
        name: ${schema.spec.name}-redis
        namespace: ${schema.spec.namespace}
      spec:
        cacheClusterID: ${schema.spec.name}-redis-cluster
        cacheNodeType: cache.t3.micro
        cacheSubnetGroupName: ${schema.spec.name}-redis-subnet-group
        engine: redis
        engineVersion: "7.1"
        numCacheNodes: 1
        port: 6379
        securityGroupIDs: 
        - ${redissecuritygroup.status.id}

  # --- PostgreSQL RDS Resources ---
  - id: postgrespassword
    includeWhen:
      - ${schema.spec.postgres.enabled}
    readyWhen:
      - ${has(postgrespassword.data)}
    template:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ${schema.spec.name}-postgres-password
        namespace: ${schema.spec.namespace}
      type: Opaque
      data:
        password: cG9zdGdyZXM= # postgres

  - id: postgressecuritygroup
    includeWhen:
      - ${schema.spec.postgres.enabled}
    readyWhen:
      - ${has(postgressecuritygroup.status.id)}
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: SecurityGroup
      metadata:
        name: ${schema.spec.name}-postgres-sg
        namespace: ${schema.spec.namespace}
      spec:
        description: "PostgreSQL RDS security group for voting app"
        name: ${schema.spec.name}-postgres-sg
        vpcID: ${schema.spec.vpcID}
        ingressRules:
        - ipProtocol: tcp
          ipRanges:
          - cidrIP: "10.0.0.0/16"
          fromPort: 5432
          toPort: 5432

  - id: postgressubnetgroup
    includeWhen:
      - ${schema.spec.postgres.enabled}
    readyWhen:
      - ${has(postgressubnetgroup.status.ackResourceMetadata)}
    template:
      apiVersion: rds.services.k8s.aws/v1alpha1
      kind: DBSubnetGroup
      metadata:
        name: ${schema.spec.name}-postgres-subnet-group
        namespace: ${schema.spec.namespace}
      spec:
        description: "PostgreSQL RDS subnet group for voting app"
        name: ${schema.spec.name}-postgres-subnet-group
        subnetIDs: ${schema.spec.subnetIDs}

  - id: postgresinstance
    includeWhen:
      - ${schema.spec.postgres.enabled}
    readyWhen:
      - ${has(postgresinstance.status.dbInstanceStatus)}
    template:
      apiVersion: rds.services.k8s.aws/v1alpha1
      kind: DBInstance
      metadata:
        name: ${schema.spec.name}-postgres
        namespace: ${schema.spec.namespace}
      spec:
        allocatedStorage: 20
        dbInstanceClass: db.t4g.micro
        dbInstanceIdentifier: ${schema.spec.name}-postgres
        backupRetentionPeriod: 0
        engine: postgres
        engineVersion: "16.3"
        masterUsername: "postgres"
        dbSubnetGroupRef: 
          from: 
            name: ${schema.spec.name}-postgres-subnet-group
        vpcSecurityGroupRefs:
          - from: 
              name: ${schema.spec.name}-postgres-sg
        masterUserPassword:
          namespace: ${schema.spec.namespace}
          name: ${schema.spec.name}-postgres-password
          key: password
        dbName: postgres

  # --- Vote App Deployment ---
  - id: votedeployment
    readyWhen:
      - ${votedeployment.spec.replicas == votedeployment.status.availableReplicas}
    template:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ${schema.spec.name}-vote
        namespace: ${schema.spec.namespace}
        labels:
          app: ${schema.spec.name}-vote
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: ${schema.spec.name}-vote
        template:
          metadata:
            labels:
              app: ${schema.spec.name}-vote
          spec:
            containers:
            - name: vote
              image: ${schema.spec.voteImage}
              imagePullPolicy: Always
              ports:
              - containerPort: 80
              env:
              - name: REDIS_HOST
                value: ${rediscluster.status.cacheNodes[0].endpoint.address}

  - id: voteservice
    includeWhen:
      - ${schema.spec.service.enabled}
    readyWhen:
      - ${has(voteservice.spec.clusterIP)}
    template:
      apiVersion: v1
      kind: Service
      metadata:
        name: ${schema.spec.name}-vote-service
        namespace: ${schema.spec.namespace}
        labels:
          app: ${schema.spec.name}-vote
      spec:
        type: ClusterIP
        selector:
          app: ${schema.spec.name}-vote
        ports:
        - port: 80
          targetPort: 80
          protocol: TCP

  # --- Vote Ingress (with SSL) ---
  - id: voteingress
    includeWhen:
      - ${schema.spec.ingress.enabled}
      - ${schema.spec.acm.enabled}
      - ${schema.spec.domain.enabled}
    readyWhen:
      - ${has(voteingress.status.loadBalancer)}
    template:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ${schema.spec.name}-vote-ingress
        namespace: ${schema.spec.namespace}
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
          alb.ingress.kubernetes.io/certificate-arn: ${acmcertificate.status.ackResourceMetadata.arn}
          alb.ingress.kubernetes.io/ssl-redirect: '443'
        labels:
          app: ${schema.spec.name}-vote
      spec:
        ingressClassName: alb
        rules:
        - host: vote.${schema.spec.domain.subdomain}.${schema.spec.domain.baseDomain}
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: ${schema.spec.name}-vote-service
                  port:
                    number: 80



  # --- Result App Deployment ---
  - id: resultdeployment
    readyWhen:
      - ${resultdeployment.spec.replicas == resultdeployment.status.availableReplicas}
    template:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ${schema.spec.name}-result
        namespace: ${schema.spec.namespace}
        labels:
          app: ${schema.spec.name}-result
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: ${schema.spec.name}-result
        template:
          metadata:
            labels:
              app: ${schema.spec.name}-result
          spec:
            containers:
            - name: result
              image: ${schema.spec.resultImage}
              imagePullPolicy: Always
              ports:
              - containerPort: 80
              env:
              - name: POSTGRES_HOST
                value: ${postgresinstance.status.endpoint.address}
              - name: POSTGRES_USER
                value: postgres
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${schema.spec.name}-postgres-password
                    key: password
              - name: POSTGRES_DB
                value: postgres

  - id: resultservice
    includeWhen:
      - ${schema.spec.service.enabled}
    readyWhen:
      - ${has(resultservice.spec.clusterIP)}
    template:
      apiVersion: v1
      kind: Service
      metadata:
        name: ${schema.spec.name}-result-service
        namespace: ${schema.spec.namespace}
        labels:
          app: ${schema.spec.name}-result
      spec:
        type: ClusterIP
        selector:
          app: ${schema.spec.name}-result
        ports:
        - port: 80
          targetPort: 80
          protocol: TCP

  # --- Result Ingress (with SSL) ---
  - id: resultingress
    includeWhen:
      - ${schema.spec.ingress.enabled}
      - ${schema.spec.acm.enabled}
      - ${schema.spec.domain.enabled}
    readyWhen:
      - ${has(resultingress.status.loadBalancer)}
    template:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ${schema.spec.name}-result-ingress
        namespace: ${schema.spec.namespace}
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
          alb.ingress.kubernetes.io/certificate-arn: ${acmcertificate.status.ackResourceMetadata.arn}
          alb.ingress.kubernetes.io/ssl-redirect: '443'
        labels:
          app: ${schema.spec.name}-result
      spec:
        ingressClassName: alb
        rules:
        - host: results.${schema.spec.domain.subdomain}.${schema.spec.domain.baseDomain}
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: ${schema.spec.name}-result-service
                  port:
                    number: 80



  # --- Worker Deployment ---
  - id: workerdeployment
    readyWhen:
      - ${workerdeployment.spec.replicas == workerdeployment.status.availableReplicas}
    template:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ${schema.spec.name}-worker
        namespace: ${schema.spec.namespace}
        labels:
          app: ${schema.spec.name}-worker
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: ${schema.spec.name}-worker
        template:
          metadata:
            labels:
              app: ${schema.spec.name}-worker
          spec:
            containers:
            - name: worker
              image: ${schema.spec.workerImage}
              imagePullPolicy: Always
              env:
              - name: REDIS_HOST
                value: ${rediscluster.status.cacheNodes[0].endpoint.address}
              - name: POSTGRES_HOST
                value: ${postgresinstance.status.endpoint.address}
              - name: POSTGRES_USER
                value: postgres
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${schema.spec.name}-postgres-password
                    key: password
              - name: POSTGRES_DB
                value: postgres