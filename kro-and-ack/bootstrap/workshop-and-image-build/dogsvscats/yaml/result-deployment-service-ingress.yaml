apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-deployment
  namespace: default
  labels:
    app: result
spec:
  replicas: 3
  selector:
    matchLabels:
      name: result-pod
      app: result
  template:
    metadata:
      name: result-pod
      labels:
        name: result-pod
        app: result
    spec:
      containers:
      - name: result
        image: 352858358668.dkr.ecr.us-east-1.amazonaws.com/result
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: POSTGRES_HOST
          value: voting-results.cvyds1wqewch.us-east-1.rds.amazonaws.com #dbinstance.status.endpoint.address
---
apiVersion: v1
kind: Service
metadata:
  name: result-service
  namespace: default
  labels:
    app: result
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    name: result-pod
    app: result
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: result-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/group.name: "vote-app-group"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/actions.redirect-to-https: >
      {"Type":"redirect","RedirectConfig":{"Protocol":"HTTPS","Port":"443","StatusCode":"HTTP_301"}}
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=60
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80, "HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: ""
  labels:
    app: result
spec:
  ingressClassName: alb
  rules:
  - host: result.dogsvscats.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: result-service
            port:
              number: 80