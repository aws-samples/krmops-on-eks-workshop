apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: podidentity.kro.run
spec:
  schema:
    apiVersion: v1alpha1
    kind: PodIdentity
    spec:
      name: string
      policyARN: string
    status:
      serviceAccount: ${serviceAccount.metadata.name}
      roleARN: ${iamRole.status.ackResourceMetadata.arn}

  resources:
    - id: iamRole
      readyWhen:
        - ${iamRole.status.conditions.exists(x, x.type == 'ACK.ResourceSynced' && x.status == "True")}
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          name: ${schema.spec.name}-pod-role
        spec:
          name: ${schema.spec.name}-pod-role
          assumeRolePolicyDocument: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "pods.eks.amazonaws.com"
                  },
                  "Action": [
                    "sts:AssumeRole",
                    "sts:TagSession"
                  ]
                }
              ]
            }
          policies:
            - ${schema.spec.policyARN}

    - id: serviceAccount
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.spec.name}-sa
          namespace: default

    - id: podIdentityAssociation
      readyWhen:
        - ${podIdentityAssociation.status.conditions.exists(x, x.type == 'ACK.ResourceSynced' && x.status == "True")}
      template:
        apiVersion: eks.services.k8s.aws/v1alpha1
        kind: PodIdentityAssociation
        metadata:
          name: ${schema.spec.name}-pod-identity
        spec:
          clusterName: kro
          namespace: default
          roleARN: ${iamRole.status.ackResourceMetadata.arn}
          serviceAccount: ${serviceAccount.metadata.name}
