apiVersion: v1alpha1
kind: NestedVotingApp
metadata:
  name: dogsvscats-nested-http
  namespace: default
spec:
  name: dogsvscats-nested-http
  namespace: default
  # Infrastructure - you'll need to provide these values
  vpcID: "vpc-xxxxxxxxx"  # Replace with your VPC ID
  subnetIDs: 
    - "subnet-xxxxxxxxx"  # Replace with your subnet IDs
    - "subnet-yyyyyyyyy"
  # HTTP-only configuration
  domain:
    enabled: false  # No custom domain
  acm:
    enabled: false  # No SSL certificates
  ingress:
    enabled: true   # HTTP-only ingress
  service:
    enabled: true
  redis:
    enabled: true
  postgres:
    enabled: true
  # Use the new TLS-enabled images
  voteImage: dogsvscats/vote:latest
  resultImage: dogsvscats/result:latest
  workerImage: dogsvscats/worker:latest